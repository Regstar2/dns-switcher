name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - 'release/**'

permissions:
  contents: read

jobs:
  build-test:
    name: Release build and tests
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 35
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          clean: true

      - name: Verify checkout
        shell: pwsh
        run: |
          git status --short
          git rev-parse HEAD

      - name: Restore
        shell: pwsh
        run: dotnet restore DnsSwitcher.sln

      - name: Build Release
        shell: pwsh
        run: dotnet build DnsSwitcher.sln -c Release --no-restore

      - name: Test Release
        shell: pwsh
        run: dotnet test DnsSwitcher.sln -c Release --no-build
